<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Canva Pro License Manager - Admin Panel</title>
  <style>
    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 4px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
      color: #fff;
    }
    .title h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .title p {
      font-size: 11px;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .btn-hdr {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow);
      color: var(--text);
    }
    .btn-hdr:active { transform: scale(0.96); }

    /* ---------- Cloud Status Bar ---------- */
    .cloud-bar {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .cloud-bar-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #065f46;
    }

    /* ---------- Stats Row ---------- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-val { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }

    /* ---------- Add User Box ---------- */
    .add-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .add-box-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group {
      margin-bottom: 8px;
    }
    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }
    .add-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      background: #f8fafc;
    }
    .add-input:focus { border-color: var(--primary); background: #fff; }

    .presets-row {
      display: flex;
      gap: 5px;
      margin: 8px 0 10px 0;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .preset-btn {
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
    }
    .preset-btn:hover, .preset-btn.active {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25);
    }
    .btn-submit:active { transform: scale(0.98); }

    /* ---------- Search & Filters ---------- */
    .search-box {
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-box:focus { border-color: var(--primary); }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .filter-tab {
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .filter-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ---------- User Cards ---------- */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 40px;
    }
    .user-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .user-email {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-expired { background: #fee2e2; color: #b91c1c; }
    .badge-suspended { background: #fef3c7; color: #b45309; }

    .user-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .action-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .act-btn {
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .act-btn:active { transform: scale(0.96); }
    .btn-extend-15 { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .btn-extend-30 { background: #dcfce7; border-color: #86efac; color: #166534; }
    .btn-custom { background: #0d9488; border-color: #0d9488; color: #fff; }
    .btn-suspend { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .btn-del { background: #fef2f2; border-color: #fecaca; color: #dc2626; margin-left: auto; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">🪄</div>
      <div class="title">
        <h1>Canva Pro Admin</h1>
        <p>Live Realtime Cloud Database</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr" onclick="loadUsers()" title="Reload Data">🔄 Refresh</button>
    </div>
  </div>

  <!-- Realtime Cloud Bar -->
  <div class="cloud-bar">
    <div class="cloud-bar-text">
      <span>🟢 Live Realtime Database Connected</span>
    </div>
    <span style="font-size:11px; color:#047857; font-weight:600;">Instant Cloud Sync</span>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="totalCount">0</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="activeCount" style="color:#16a34a;">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="expiredCount" style="color:#dc2626;">0</div>
      <div class="stat-label">Expired</div>
    </div>
  </div>

  <!-- Add Subscriber / Custom Duration Box -->
  <div class="add-box">
    <div class="add-box-title">
      <span>👤 Add / Set User Subscription</span>
    </div>
    <div class="input-group">
      <label class="input-label">User Gmail</label>
      <input type="email" id="newEmail" class="add-input" placeholder="user@gmail.com">
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div class="input-group">
        <label class="input-label">Plan Name</label>
        <input type="text" id="newPlan" class="add-input" value="Monthly Pro">
      </div>
      <div class="input-group">
        <label class="input-label">Custom Days</label>
        <input type="number" id="newDays" class="add-input" value="15" min="1">
      </div>
    </div>

    <!-- Quick Presets -->
    <div class="presets-row">
      <button class="preset-btn active" onclick="setPreset(15, '15-Day Trial', this)">15 Days (Trial)</button>
      <button class="preset-btn" onclick="setPreset(30, 'Monthly Pro', this)">30 Days (1M)</button>
      <button class="preset-btn" onclick="setPreset(60, '2-Month Pro', this)">60 Days (2M)</button>
      <button class="preset-btn" onclick="setPreset(90, 'Quarterly Pro', this)">90 Days (3M)</button>
      <button class="preset-btn" onclick="setPreset(365, '1-Year Pro', this)">365 Days (1Y)</button>
    </div>

    <button class="btn-submit" id="btnSubmitUser" onclick="handleAddUser()">
      <span>⚡ Save & Sync Subscription</span>
    </button>
  </div>

  <!-- Search -->
  <input type="text" id="searchBox" placeholder="🔍 Search by Gmail..." class="search-box" oninput="renderUsers()">

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All Users</div>
    <div class="filter-tab" data-filter="active" onclick="setFilter('active')">✅ Active</div>
    <div class="filter-tab" data-filter="expired" onclick="setFilter('expired')">❌ Expired</div>
    <div class="filter-tab" data-filter="suspended" onclick="setFilter('suspended')">⛔ Suspended</div>
  </div>

  <!-- User Cards Container -->
  <div class="user-list" id="userList">
    <div style="text-align: center; color: #64748b; font-size: 12px; padding: 30px;">Loading users from live database...</div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">Action completed!</div>

  <script>
    const FIREBASE_DB_URL = "https://pngtree-meta-default-rtdb.firebaseio.com/canva_users";

    let currentFilter = 'all';
    let allUsers = [];

    window.onload = () => {
      loadUsers();
    };

    async function loadUsers() {
      const container = document.getElementById('userList');
      container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 12px; padding: 30px;">Loading live database...</div>';

      try {
        const res = await fetch(`${FIREBASE_DB_URL}.json?nocache=${Date.now()}`);
        if (!res.ok) throw new Error("Could not fetch database");
        const data = await res.json() || {};
        
        allUsers = Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        updateStats();
        renderUsers();
      } catch (err) {
        container.innerHTML = `<div style="text-align:center; color:#ef4444; font-size:12px; padding:20px;">Error: ${err.message}<br><button onclick="loadUsers()" style="margin-top:8px; padding:6px 12px; background:#16a34a; color:#fff; border:none; border-radius:6px; cursor:pointer;">Retry</button></div>`;
      }
    }

    function setPreset(days, plan, btn) {
      document.getElementById('newDays').value = days;
      document.getElementById('newPlan').value = plan;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === filter);
      });
      renderUsers();
    }

    function updateStats() {
      const now = Date.now();
      let active = 0, expired = 0;

      allUsers.forEach(u => {
        const exp = u.subscriptionExpiresAt || (u.expiryDate ? new Date(u.expiryDate).getTime() : 0);
        if (u.status === 'active' && exp > now) active++;
        else expired++;
      });

      document.getElementById('totalCount').innerText = allUsers.length;
      document.getElementById('activeCount').innerText = active;
      document.getElementById('expiredCount').innerText = expired;
    }

    function renderUsers() {
      const container = document.getElementById('userList');
      const q = document.getElementById('searchBox').value.toLowerCase().trim();
      const now = Date.now();

      const filtered = allUsers.filter(u => {
        const email = (u.email || '').toLowerCase();
        if (q && !email.includes(q)) return false;

        const exp = u.subscriptionExpiresAt || (u.expiryDate ? new Date(u.expiryDate).getTime() : 0);
        const isExp = exp <= now;

        if (currentFilter === 'active') return u.status === 'active' && !isExp;
        if (currentFilter === 'expired') return isExp || u.status !== 'active';
        if (currentFilter === 'suspended') return u.status !== 'active';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 12px; padding: 30px;">No subscribers found.</div>';
        return;
      }

      container.innerHTML = filtered.map(u => {
        const email = u.email;
        const expTime = u.subscriptionExpiresAt || (u.expiryDate ? new Date(u.expiryDate).getTime() : 0);
        const isExpired = expTime <= now;
        let daysLeft = Math.ceil((expTime - now) / (1000 * 60 * 60 * 24));
        if (daysLeft < 0) daysLeft = 0;

        let badgeClass = 'badge-active';
        let badgeText = `Active (${daysLeft}d left)`;

        if (u.status !== 'active') {
          badgeClass = 'badge-suspended';
          badgeText = 'Suspended';
        } else if (isExpired) {
          badgeClass = 'badge-expired';
          badgeText = 'Expired';
        }

        const dateStr = u.expiryDate || new Date(expTime).toISOString().split('T')[0];

        return `
          <div class="user-card">
            <div class="user-card-header">
              <span class="user-email">${email}</span>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="user-meta">
              Plan: <b>${u.plan || 'Custom'}</b> • Expires: <span style="color:#0f172a; font-weight:700;">${dateStr}</span><br>
              Status: <b>${u.status}</b>
            </div>
            <div class="action-row">
              <button class="act-btn btn-extend-15" onclick="quickExtend('${email}', 15)" title="Add 15 days">⚡ +15d</button>
              <button class="act-btn btn-extend-30" onclick="quickExtend('${email}', 30)" title="Add 30 days">⚡ +30d</button>
              <button class="act-btn btn-custom" onclick="customExtendPrompt('${email}')" title="ইচ্ছামতো দিন দিন">📅 Custom Days</button>
              <button class="act-btn btn-suspend" onclick="toggleStatus('${email}')">${u.status === 'active' ? '⛔ Suspend' : '✅ Activate'}</button>
              <button class="act-btn btn-del" onclick="deleteUser('${email}')" title="Delete User">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleAddUser() {
      const email = document.getElementById('newEmail').value.trim().toLowerCase();
      const days = parseInt(document.getElementById('newDays').value, 10) || 15;
      const plan = document.getElementById('newPlan').value.trim() || 'Custom Plan';

      if (!email || !email.includes('@')) {
        alert("দয়া করে সঠিক জিমেইল এড্রেস লিখুন!");
        return;
      }

      const now = Date.now();
      const expTime = now + (days * 24 * 60 * 60 * 1000);
      const expiryDate = new Date(expTime).toISOString().split('T')[0];

      const record = {
        email: email,
        status: "active",
        plan: plan,
        expiryDate: expiryDate,
        subscriptionExpiresAt: expTime,
        days: days,
        createdAt: now
      };

      const sanitizedKey = email.replace(/\./g, ",");
      await fetch(`${FIREBASE_DB_URL}/${sanitizedKey}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      });

      document.getElementById('newEmail').value = '';
      showToast(`✅ ${email} সেভ করা হয়েছে (${days} দিন)`);
      await loadUsers();
    }

    async function quickExtend(email, addDays) {
      const sanitizedKey = email.replace(/\./g, ",");
      const user = allUsers.find(u => u.email === email);
      if (!user) return;

      const now = Date.now();
      const currentExp = user.subscriptionExpiresAt || (user.expiryDate ? new Date(user.expiryDate).getTime() : 0);
      const base = currentExp > now ? currentExp : now;
      const newExp = base + (addDays * 24 * 60 * 60 * 1000);
      const newExpiryDate = new Date(newExp).toISOString().split('T')[0];

      await fetch(`${FIREBASE_DB_URL}/${sanitizedKey}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          status: "active",
          subscriptionExpiresAt: newExp,
          expiryDate: newExpiryDate
        })
      });

      showToast(`✅ ${email} কে +${addDays} দিন বৃদ্ধি করা হয়েছে!`);
      await loadUsers();
    }

    async function customExtendPrompt(email) {
      const input = prompt(`কত দিন মেয়াদ বাড়াতে চান (${email}) এর জন্য?\n(যেমন: 7, 15, 30, 45, 60, 90, 365)`, "30");
      if (input !== null) {
        const d = parseInt(input.trim(), 10);
        if (isNaN(d) || d <= 0) {
          alert("সঠিক দিন সংখ্যা লিখুন (যেমন: 15, 30)");
          return;
        }
        await quickExtend(email, d);
      }
    }

    async function toggleStatus(email) {
      const user = allUsers.find(u => u.email === email);
      if (!user) return;
      const newStatus = (user.status === 'active') ? 'suspended' : 'active';
      const sanitizedKey = email.replace(/\./g, ",");

      await fetch(`${FIREBASE_DB_URL}/${sanitizedKey}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus })
      });

      showToast(`Status updated: ${newStatus}`);
      await loadUsers();
    }

    async function deleteUser(email) {
      if (confirm(`Are you sure you want to delete ${email}?`)) {
        const sanitizedKey = email.replace(/\./g, ",");
        await fetch(`${FIREBASE_DB_URL}/${sanitizedKey}.json`, {
          method: "DELETE"
        });
        showToast(`🗑️ ${email} ডিলিট করা হয়েছে!`);
        await loadUsers();
      }
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
