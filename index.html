<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Canva Pro License Manager - Admin Panel</title>
  <style>
    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 4px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
      color: #fff;
    }
    .title h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .title p {
      font-size: 11px;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .btn-hdr {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow);
      color: var(--text);
    }
    .btn-hdr:active { transform: scale(0.96); }

    /* ---------- Token Status Bar ---------- */
    .token-bar {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .token-bar.warning {
      background: #fffbeb;
      border-color: #fde68a;
    }
    .token-bar-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: #065f46;
    }
    .token-bar.warning .token-bar-text {
      color: #92400e;
    }
    .token-bar-btn {
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ---------- Stats Row ---------- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-val { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }

    /* ---------- Add User Box ---------- */
    .add-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .add-box-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group {
      margin-bottom: 8px;
    }
    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }
    .add-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      background: #f8fafc;
    }
    .add-input:focus { border-color: var(--primary); background: #fff; }

    .presets-row {
      display: flex;
      gap: 5px;
      margin: 8px 0 10px 0;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .preset-btn {
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
    }
    .preset-btn:hover, .preset-btn.active {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25);
    }
    .btn-submit:active { transform: scale(0.98); }

    /* ---------- Search & Filters ---------- */
    .search-box {
      width: 100%;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-box:focus { border-color: var(--primary); }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .filter-tab {
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .filter-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ---------- User Cards ---------- */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 40px;
    }
    .user-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .user-email {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-expired { background: #fee2e2; color: #b91c1c; }
    .badge-suspended { background: #fef3c7; color: #b45309; }

    .user-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .action-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .act-btn {
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .act-btn:active { transform: scale(0.96); }
    .btn-extend-15 { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .btn-extend-30 { background: #dcfce7; border-color: #86efac; color: #166534; }
    .btn-custom { background: #0d9488; border-color: #0d9488; color: #fff; }
    .btn-suspend { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .btn-del { background: #fef2f2; border-color: #fecaca; color: #dc2626; margin-left: auto; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">🪄</div>
      <div class="title">
        <h1>Canva Pro Admin</h1>
        <p>GitHub Remote License Manager</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr" onclick="setupTokenPrompt()" title="GitHub Token Setup">🔑 Token</button>
      <button class="btn-hdr" onclick="loadLicenses()" title="Reload Data">🔄 Refresh</button>
    </div>
  </div>

  <!-- Token Bar -->
  <div class="token-bar" id="tokenStatusBar">
    <div class="token-bar-text" id="tokenStatusText">
      <span>● Checking GitHub Token...</span>
    </div>
    <button class="token-bar-btn" onclick="setupTokenPrompt()">Set Token</button>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="totalCount">0</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="activeCount" style="color:#16a34a;">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="expiredCount" style="color:#dc2626;">0</div>
      <div class="stat-label">Expired</div>
    </div>
  </div>

  <!-- Add Subscriber / Custom Duration Box -->
  <div class="add-box">
    <div class="add-box-title">
      <span>👤 Add / Set User Subscription</span>
    </div>
    <div class="input-group">
      <label class="input-label">User Gmail</label>
      <input type="email" id="newEmail" class="add-input" placeholder="user@gmail.com">
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div class="input-group">
        <label class="input-label">Plan Name</label>
        <input type="text" id="newPlan" class="add-input" value="Monthly Pro">
      </div>
      <div class="input-group">
        <label class="input-label">Custom Days</label>
        <input type="number" id="newDays" class="add-input" value="15" min="1">
      </div>
    </div>

    <!-- Quick Presets -->
    <div class="presets-row">
      <button class="preset-btn active" onclick="setPreset(15, '15-Day Trial', this)">15 Days (Trial)</button>
      <button class="preset-btn" onclick="setPreset(30, 'Monthly Pro', this)">30 Days (1M)</button>
      <button class="preset-btn" onclick="setPreset(60, '2-Month Pro', this)">60 Days (2M)</button>
      <button class="preset-btn" onclick="setPreset(90, 'Quarterly Pro', this)">90 Days (3M)</button>
      <button class="preset-btn" onclick="setPreset(365, '1-Year Pro', this)">365 Days (1Y)</button>
    </div>

    <button class="btn-submit" id="btnSubmitUser" onclick="handleAddUser()">
      <span>⚡ Save & Sync Subscription</span>
    </button>
  </div>

  <!-- Search -->
  <input type="text" id="searchBox" placeholder="🔍 Search by Gmail..." class="search-box" oninput="renderUsers()">

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All Users</div>
    <div class="filter-tab" data-filter="active" onclick="setFilter('active')">✅ Active</div>
    <div class="filter-tab" data-filter="expired" onclick="setFilter('expired')">❌ Expired</div>
    <div class="filter-tab" data-filter="suspended" onclick="setFilter('suspended')">⛔ Suspended</div>
  </div>

  <!-- User Cards Container -->
  <div class="user-list" id="userList">
    <div style="text-align: center; color: #64748b; font-size: 12px; padding: 30px;">Loading users from GitHub...</div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">Action completed!</div>

  <script>
    const GH_USER = "smrkarim555";
    const GH_REPO = "canva-bulk-licenses";
    const RAW_URL = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/licenses.json`;

    let currentFilter = 'all';
    let dbData = { settings: {}, users: {} };
    let currentSha = null;

    window.onload = () => {
      checkTokenStatus();
      loadLicenses();
    };

    function checkTokenStatus() {
      const token = localStorage.getItem('gh_pat_token') || '';
      const bar = document.getElementById('tokenStatusBar');
      const text = document.getElementById('tokenStatusText');

      if (token) {
        bar.className = 'token-bar';
        text.innerHTML = '<span>🟢 Direct GitHub Cloud Sync Active (No redirects)</span>';
      } else {
        bar.className = 'token-bar warning';
        text.innerHTML = '<span>🟡 GitHub Token not set (Click Set Token to auto-save to cloud)</span>';
      }
    }

    function setupTokenPrompt() {
      const current = localStorage.getItem('gh_pat_token') || '';
      const token = prompt(
        "গিটহাবে সরাসরি অটো-সেভ করার জন্য আপনার GitHub Personal Access Token (PAT) দিন:\n(একবার দিলেই ব্রাউজারে সেভ থাকবে, ডিলিট বা এডিট করলে আর কোনো পেজ রিডাইরেক্ট হবে না)",
        current
      );
      if (token !== null) {
        if (token.trim()) {
          localStorage.setItem('gh_pat_token', token.trim());
          showToast("✅ GitHub Token সেভ হয়েছে!");
        } else {
          localStorage.removeItem('gh_pat_token');
          showToast("Token মুছে ফেলা হয়েছে।");
        }
        checkTokenStatus();
      }
    }

    async function loadLicenses() {
      const container = document.getElementById('userList');
      container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 12px; padding: 30px;">Loading live database...</div>';

      try {
        const res = await fetch(`${RAW_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Could not fetch licenses.json from GitHub");
        dbData = await res.json();
        if (!dbData.users) dbData.users = {};
        updateStats();
        renderUsers();
      } catch (err) {
        container.innerHTML = `<div style="text-align:center; color:#ef4444; font-size:12px; padding:20px;">Error: ${err.message}<br><button onclick="loadLicenses()" style="margin-top:8px; padding:6px 12px; background:#16a34a; color:#fff; border:none; border-radius:6px; cursor:pointer;">Retry</button></div>`;
      }
    }

    function setPreset(days, plan, btn) {
      document.getElementById('newDays').value = days;
      document.getElementById('newPlan').value = plan;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === filter);
      });
      renderUsers();
    }

    function updateStats() {
      const users = Object.values(dbData.users || {});
      const now = new Date();
      let active = 0, expired = 0;

      users.forEach(u => {
        const exp = new Date(u.expiryDate);
        if (u.status === 'active' && exp >= now) active++;
        else expired++;
      });

      document.getElementById('totalCount').innerText = users.length;
      document.getElementById('activeCount').innerText = active;
      document.getElementById('expiredCount').innerText = expired;
    }

    function renderUsers() {
      const container = document.getElementById('userList');
      const q = document.getElementById('searchBox').value.toLowerCase().trim();
      const emails = Object.keys(dbData.users || {});
      const now = new Date();

      const filtered = emails.filter(email => {
        if (q && !email.includes(q)) return false;
        const u = dbData.users[email];
        const isExp = new Date(u.expiryDate) < now;

        if (currentFilter === 'active') return u.status === 'active' && !isExp;
        if (currentFilter === 'expired') return isExp || u.status !== 'active';
        if (currentFilter === 'suspended') return u.status !== 'active';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 12px; padding: 30px;">No subscribers found.</div>';
        return;
      }

      container.innerHTML = filtered.map(email => {
        const u = dbData.users[email];
        const expiry = new Date(u.expiryDate);
        const isExpired = expiry < now;
        let daysLeft = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
        if (daysLeft < 0) daysLeft = 0;

        let badgeClass = 'badge-active';
        let badgeText = `Active (${daysLeft}d left)`;

        if (u.status !== 'active') {
          badgeClass = 'badge-suspended';
          badgeText = 'Suspended';
        } else if (isExpired) {
          badgeClass = 'badge-expired';
          badgeText = 'Expired';
        }

        return `
          <div class="user-card">
            <div class="user-card-header">
              <span class="user-email">${email}</span>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="user-meta">
              Plan: <b>${u.plan || 'Custom'}</b> • Expires: <span style="color:#0f172a; font-weight:700;">${u.expiryDate}</span><br>
              Created: ${u.createdAt || 'N/A'} • Status: <b>${u.status}</b>
            </div>
            <div class="action-row">
              <button class="act-btn btn-extend-15" onclick="quickExtend('${email}', 15)" title="Add 15 days">⚡ +15d</button>
              <button class="act-btn btn-extend-30" onclick="quickExtend('${email}', 30)" title="Add 30 days">⚡ +30d</button>
              <button class="act-btn btn-custom" onclick="customExtendPrompt('${email}')" title="ইচ্ছামতো দিন দিন">📅 Custom Days</button>
              <button class="act-btn btn-suspend" onclick="toggleStatus('${email}')">${u.status === 'active' ? '⛔ Suspend' : '✅ Activate'}</button>
              <button class="act-btn btn-del" onclick="deleteUser('${email}')" title="Delete User">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleAddUser() {
      const email = document.getElementById('newEmail').value.trim().toLowerCase();
      const days = parseInt(document.getElementById('newDays').value, 10) || 15;
      const plan = document.getElementById('newPlan').value.trim() || 'Custom Plan';

      if (!email || !email.includes('@')) {
        alert("দয়া করে সঠিক জিমেইল এড্রেস লিখুন!");
        return;
      }

      const now = new Date();
      now.setDate(now.getDate() + days);
      const expiryDate = now.toISOString().split('T')[0];

      dbData.users[email] = {
        status: "active",
        plan: plan,
        expiryDate: expiryDate,
        days: days,
        createdAt: new Date().toISOString().split('T')[0]
      };

      document.getElementById('newEmail').value = '';
      updateStats();
      renderUsers();
      showToast(`✅ ${email} সেভ করা হয়েছে (${days} দিন)`);

      await saveChanges(`Add subscriber ${email} for ${days} days`);
    }

    async function quickExtend(email, addDays) {
      const u = dbData.users[email];
      if (!u) return;

      const currentExp = new Date(u.expiryDate);
      const now = new Date();
      const base = currentExp > now ? currentExp : now;
      base.setDate(base.getDate() + addDays);

      u.expiryDate = base.toISOString().split('T')[0];
      u.status = 'active';

      updateStats();
      renderUsers();
      showToast(`✅ ${email} কে +${addDays} দিন বৃদ্ধি করা হয়েছে!`);

      await saveChanges(`Extend ${email} by ${addDays} days`);
    }

    async function customExtendPrompt(email) {
      const u = dbData.users[email];
      if (!u) return;

      const input = prompt(`কত দিন মেয়াদ বাড়াতে চান (${email}) এর জন্য?\n(যেমন: 7, 15, 30, 45, 60, 90, 365)`, "30");
      if (input !== null) {
        const d = parseInt(input.trim(), 10);
        if (isNaN(d) || d <= 0) {
          alert("সঠিক দিন সংখ্যা লিখুন (যেমন: 15, 30)");
          return;
        }
        await quickExtend(email, d);
      }
    }

    async function toggleStatus(email) {
      const u = dbData.users[email];
      if (!u) return;
      u.status = (u.status === 'active') ? 'suspended' : 'active';
      updateStats();
      renderUsers();
      showToast(`Status updated: ${u.status}`);
      await saveChanges(`Toggle status ${email}`);
    }

    async function deleteUser(email) {
      if (confirm(`Are you sure you want to delete ${email}?`)) {
        delete dbData.users[email];
        updateStats();
        renderUsers();
        showToast(`🗑️ ${email} ডিলিট করা হয়েছে!`);
        await saveChanges(`Delete user ${email}`);
      }
    }

    // Direct background sync to GitHub via REST API - NO REDIRECTS EVER!
    async function saveChanges(commitMsg) {
      const token = localStorage.getItem('gh_pat_token') || '';

      if (!token) {
        // If token not present, ask gently once
        const userToken = prompt(
          "গিটহাবে সরাসরি ক্লাউডে অটো-সেভ করতে GitHub Token দিন:\n(একবার দিলেই ব্রাউজারে সেভ থাকবে, কোনো পেজ ওপেন হবে না)",
          ""
        );
        if (userToken && userToken.trim()) {
          localStorage.setItem('gh_pat_token', userToken.trim());
          checkTokenStatus();
          return saveChanges(commitMsg);
        } else {
          showToast("⚠️ পরিবর্তনটি কেবল এই পেজে সংরক্ষিত (টোকেন দিলে গিটহাবে সেভ হবে)");
          return;
        }
      }

      showToast("⏳ গিটহাবে অটো-সেভ হচ্ছে...");

      try {
        // 1. Fetch current file SHA
        const getRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/licenses.json`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getRes.ok) {
          if (getRes.status === 401) {
            localStorage.removeItem('gh_pat_token');
            checkTokenStatus();
            alert("GitHub Token টি ভুল বা ইনভ্যালিড। দয়া করে সঠিক টোকেন দিন।");
            return;
          }
          throw new Error(`GitHub API Error: ${getRes.statusText}`);
        }

        const fileData = await getRes.json();
        const sha = fileData.sha;

        // 2. Put updated JSON
        const jsonStr = JSON.stringify(dbData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

        const putRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/licenses.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: commitMsg || "Update licenses.json via Admin Panel",
            content: base64Content,
            sha: sha
          })
        });

        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(err.message || "Failed to commit");
        }

        showToast("✅ গিটহাবে ক্লাউড সেভ সম্পন্ন হয়েছে!");
      } catch (err) {
        console.error("Cloud sync error:", err);
        showToast("❌ ক্লাউড এরর: " + err.message);
      }
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
